name: net-bond-007
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Raymond Bennett <raymond.bennett@gmail.com>
description: |
  Net-Bond-007 multipath bonding client. Bonds Ethernet, Wi-Fi, USB tethering,
  cellular and Bluetooth into one faster, more reliable connection.
homepage: https://github.com/rayzorben/net-bond-007
license: MIT
contents:
  - src: ${BIN}
    dst: /usr/bin/net-bond-007
    file_info: { mode: 0755 }
  - src: packaging/linux/net-bond-007.service
    dst: /usr/lib/systemd/system/net-bond-007.service
  - dst: /etc/net-bond-007
    type: dir
    file_info: { mode: 0755 }
scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
overrides:
  deb:
    depends: [iproute2]
  rpm:
    depends: [iproute]
  archlinux:
    depends: [iproute2]
