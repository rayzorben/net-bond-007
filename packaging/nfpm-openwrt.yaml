name: net-bond-007
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: net
maintainer: Raymond Bennett <raymond.bennett@gmail.com>
description: Net-Bond-007 multipath bonding client (bonds WAN, Wi-Fi repeater, USB tethering and cellular into one link)
homepage: https://github.com/rayzorben/net-bond-007
license: MIT
depends: [kmod-tun]
contents:
  - src: ${BIN}
    dst: /usr/bin/net-bond-007
    file_info: { mode: 0755 }
  - src: packaging/openwrt/net-bond-007.init
    dst: /etc/init.d/net-bond-007
    file_info: { mode: 0755 }
  - src: packaging/openwrt/client.json
    dst: /etc/net-bond-007/client.json
    type: config|noreplace
scripts:
  postinstall: packaging/openwrt/postinst.sh
  preremove: packaging/openwrt/prerm.sh
